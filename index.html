<title>Jacob Capone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef;
    --surface: #efece4;
    --ink: #1c1b19;
    --muted: #7a756c;
    --line: #ddd9cf;
    --placeholder-a: #e7e3d9;
    --placeholder-b: #ddd8cb;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14130f;
      --surface: #1c1a15;
      --ink: #ece9e2;
      --muted: #9c9689;
      --line: #2c2920;
      --placeholder-a: #201e18;
      --placeholder-b: #26241d;
    }
  }

  :root[data-theme="dark"] {
    --bg: #14130f;
    --surface: #1c1a15;
    --ink: #ece9e2;
    --muted: #9c9689;
    --line: #2c2920;
    --placeholder-a: #201e18;
    --placeholder-b: #26241d;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Work Sans", ui-sans-serif, system-ui, sans-serif;
    padding: 0 24px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1120px;
    margin: 0 auto;
  }

  .kicker {
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
  }

  header.site-head {
    padding-block: 72px 56px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  h1.wordmark {
    font-family: "Instrument Serif", ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(40px, 7vw, 68px);
    line-height: 1.02;
    margin: 0;
    text-wrap: balance;
  }

  .gallery {
    column-count: 1;
    column-gap: 28px;
    padding-bottom: 64px;
  }

  @media (min-width: 640px) {
    .gallery { column-count: 2; }
  }

  @media (min-width: 1040px) {
    .gallery { column-count: 3; }
  }

  .gallery figure {
    break-inside: avoid;
    margin: 0 0 28px;
    position: relative;
  }

  .gallery img {
    display: block;
    width: 100%;
    height: auto;
  }

  .frame-index {
    position: absolute;
    left: 12px;
    bottom: 12px;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--bg);
    background: color-mix(in srgb, var(--ink) 70%, transparent);
    padding: 3px 7px;
    opacity: 0;
    transition: opacity 0.15s ease;
    pointer-events: none;
  }

  .gallery figure:hover .frame-index {
    opacity: 1;
  }

  footer.contact {
    border-top: 1px solid var(--line);
    padding-block: 40px 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
  }

  footer.contact .name {
    font-family: "Instrument Serif", ui-serif, Georgia, serif;
    font-style: italic;
    font-size: 22px;
    margin: 4px 0 2px;
  }

  footer.contact a {
    color: var(--ink);
    text-decoration: none;
    font-size: 14px;
  }

  footer.contact a:hover,
  footer.contact a:focus-visible {
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  footer.contact a:focus-visible {
    outline: 2px solid var(--muted);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .frame-index { transition: none; }
  }
</style>

<div class="wrap">
  <header class="site-head">
    <h1 class="wordmark">Jacob Capone</h1>
    <p class="kicker">Photography</p>
  </header>

  <div class="gallery" id="gallery">
    <figure><img src="photos/01.jpg" alt="Photograph 01" loading="lazy"><div class="frame-index">01 / 13</div></figure>
    <figure><img src="photos/02.jpg" alt="Photograph 02" loading="lazy"><div class="frame-index">02 / 13</div></figure>
    <figure><img src="photos/03.jpg" alt="Photograph 03" loading="lazy"><div class="frame-index">03 / 13</div></figure>
    <figure><img src="photos/04.jpg" alt="Photograph 04" loading="lazy"><div class="frame-index">04 / 13</div></figure>
    <figure><img src="photos/05.jpg" alt="Photograph 05" loading="lazy"><div class="frame-index">05 / 13</div></figure>
    <figure><img src="photos/06.jpg" alt="Photograph 06" loading="lazy"><div class="frame-index">06 / 13</div></figure>
    <figure><img src="photos/07.jpg" alt="Photograph 07" loading="lazy"><div class="frame-index">07 / 13</div></figure>
    <figure><img src="photos/08.jpg" alt="Photograph 08" loading="lazy"><div class="frame-index">08 / 13</div></figure>
    <figure><img src="photos/09.jpg" alt="Photograph 09" loading="lazy"><div class="frame-index">09 / 13</div></figure>
    <figure><img src="photos/10.jpg" alt="Photograph 10" loading="lazy"><div class="frame-index">10 / 13</div></figure>
    <figure><img src="photos/11.jpg" alt="Photograph 11" loading="lazy"><div class="frame-index">11 / 13</div></figure>
    <figure><img src="photos/12.jpg" alt="Photograph 12" loading="lazy"><div class="frame-index">12 / 13</div></figure>
    <figure><img src="photos/13.jpg" alt="Photograph 13" loading="lazy"><div class="frame-index">13 / 13</div></figure>
  </div>

  <footer class="contact">
    <p class="kicker">Contact</p>
    <p class="name">Jacob Capone</p>
    <p><a href="tel:+17326741961">(732) 674-1961</a></p>
    <p><a href="mailto:jacob.capone@icloud.com">jacob.capone@icloud.com</a></p>
  </footer>
</div>
